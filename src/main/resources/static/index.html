<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>学生管理系统</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f7fa; }
        .container { max-width: 950px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        h1 { color: #2c3e50; margin-top: 0; }
        table { border-collapse: collapse; width: 100%; margin-top: 16px; }
        th, td { border: 1px solid #ddd; padding: 10px 12px; text-align: left; }
        th { background: #f0f2f5; font-weight: 600; }
        .btn { padding: 6px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .btn-primary { background: #3498db; color: #fff; }
        .btn-primary:hover { background: #2980b9; }
        .btn-success { background: #27ae60; color: #fff; }
        .btn-success:hover { background: #1e8449; }
        .btn-danger { background: #e74c3c; color: #fff; }
        .btn-danger:hover { background: #c0392b; }
        .btn-warning { background: #f39c12; color: #fff; }
        .btn-warning:hover { background: #d68910; }
        .btn-sm { padding: 3px 10px; font-size: 13px; }
        .form-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
        .form-row input { padding: 7px 10px; border: 1px solid #ccc; border-radius: 4px; width: 140px; }
        .form-row input[type="number"] { width: 80px; }
        .search-area { background: #f8f9fa; padding: 12px 14px; border-radius: 6px; margin-bottom: 14px; }
        .action-cell { display: flex; gap: 6px; flex-wrap: wrap; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: #fff; padding: 24px 32px; border-radius: 8px; width: 360px; max-width: 90%; }
        .modal-box h3 { margin-top: 0; }
        .modal-box input { width: 100%; padding: 8px 10px; margin: 6px 0 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .modal-box .btn-row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 12px; }
        .pagination { margin-top: 16px; display: flex; align-items: center; gap: 12px; justify-content: center; }
        .pagination .info { font-size: 14px; color: #555; }
        .pagination .btn { min-width: 70px; }
        .batch-delete-area { margin: 8px 0; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .checkbox-col { width: 40px; text-align: center; }
        .checkbox-col input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
        th.checkbox-col input[type="checkbox"] { width: 16px; height: 16px; }
        .selected-count { font-size: 14px; color: #555; }
        #fileInput { display: none; }
    </style>
</head>
<body>
<div class="container">
    <h1>📚 学生管理系统</h1>

    <div class="search-area">
        <div class="form-row">
            <button class="btn btn-primary" id="loadAllBtn">📋 加载全部（分页）</button>
            <input type="text" id="nameInput" placeholder="姓名关键词">
            <button class="btn btn-primary" id="searchNameBtn">🔍 搜索</button>
            <input type="number" id="minAgeInput" placeholder="最小年龄" style="width:70px;">
            <input type="number" id="maxAgeInput" placeholder="最大年龄" style="width:70px;">
            <button class="btn btn-primary" id="searchAgeBtn">🔍 按年龄</button>
            <select id="genderFilter" style="padding:7px 10px; border:1px solid #ccc; border-radius:4px;">
                <option value="">全部性别</option>
                <option value="男">只看男生</option>
                <option value="女">只看女生</option>
            </select>
        </div>
        <div class="form-row">
            <span style="font-weight:600;margin-right:6px;">➕ 添加学生：</span>
            <input type="text" id="newId" placeholder="学号" style="width:100px;">
            <input type="text" id="newName" placeholder="姓名" style="width:100px;">
            <input type="number" id="newAge" placeholder="年龄" style="width:70px;">
            <input type="text" id="newGender" placeholder="性别" style="width:70px;">
            <button class="btn btn-success" id="addBtn">添加</button>
        </div>
    </div>

    <div class="batch-delete-area">
        <button class="btn btn-danger" id="batchDeleteBtn">🗑️ 批量删除</button>
        <span class="selected-count" id="selectedCount">已选 0 人</span>
        <span style="font-size:14px;color:#888;">（翻页后选中状态会保留）</span>
        <button class="btn btn-success" id="exportBtn">📥 导出 Excel</button>
        <input type="file" id="fileInput" accept=".xlsx,.xls">
        <button class="btn btn-primary" id="importBtn">📤 导入 Excel</button>
        <span style="margin-left:20px; font-weight:600;">生成测试数据：</span>
        <input type="number" id="generateCount" placeholder="数量" style="width:70px; padding:7px 10px; border:1px solid #ccc; border-radius:4px;">
        <button class="btn btn-warning" id="generateBtn">生成</button>
    </div>

    <div id="statsPanel" style="margin: 12px 0; font-size: 15px; font-weight: 500; color: #2c3e50; background: #ecf0f1; padding: 8px 16px; border-radius: 4px;">
        📊 统计信息：加载中...
    </div>

    <table id="studentTable">
        <thead><tr>
            <th class="checkbox-col"><input type="checkbox" id="selectAll"></th>
            <th>学号</th>
            <th>姓名</th>
            <th>年龄</th>
            <th>是否成年</th>
            <th>性别</th>
            <th style="width:150px;">操作</th>
        </tr></thead>
        <tbody id="studentBody">
        <tr><td colspan="7">点击「加载全部（分页）」查看数据</td></tr>
        </tbody>
    </table>

    <div class="pagination">
        <button class="btn btn-primary" id="prevPageBtn">⬅ 上一页</button>
        <span class="info" id="pageInfo">第 1 / 1 页</span>
        <button class="btn btn-primary" id="nextPageBtn">下一页 ➡</button>
    </div>
</div>

<div class="modal-overlay" id="editModal">
    <div class="modal-box">
        <h3>✏️ 修改学生</h3>
        <label>学号</label><input type="text" id="editId" readonly>
        <label>姓名</label><input type="text" id="editName">
        <label>年龄</label><input type="number" id="editAge">
        <label>性别</label><input type="text" id="editGender">
        <div class="btn-row">
            <button class="btn btn-warning" id="editCancelBtn">取消</button>
            <button class="btn btn-success" id="editConfirmBtn">保存</button>
        </div>
    </div>
</div>
<script>
    const API_BASE = 'http://localhost:8081';
    let editingId = null;
    let currentPage = 1;
    let totalPages = 1;
    let selectedIds = new Set();

    // ========== 复选框状态管理 ==========
    function toggleSelection(id, checked) {
        if (checked) {
            selectedIds.add(id);
        } else {
            selectedIds.delete(id);
        }
        updateSelectedCount();
        updateSelectAllState();
    }

    function updateSelectedCount() {
        document.getElementById('selectedCount').textContent = `已选 ${selectedIds.size} 人`;
    }

    function updateSelectAllState() {
        const checkboxes = document.querySelectorAll('.student-checkbox');
        const allChecked = checkboxes.length > 0 && Array.from(checkboxes).every(cb => cb.checked);
        const selectAll = document.getElementById('selectAll');
        if (allChecked) {
            selectAll.checked = true;
            selectAll.indeterminate = false;
        } else if (checkboxes.length > 0 && Array.from(checkboxes).some(cb => cb.checked)) {
            selectAll.indeterminate = true;
        } else {
            selectAll.checked = false;
            selectAll.indeterminate = false;
        }
    }

    // ========== 渲染表格 ==========
    function renderPage(apiResult) {
        const pageData = apiResult.data || apiResult;
        const records = pageData.records || [];
        totalPages = pageData.pages || 1;
        currentPage = pageData.current || 1;

        document.getElementById('pageInfo').textContent = `第 ${currentPage} / ${totalPages} 页`;
        document.getElementById('prevPageBtn').disabled = (currentPage <= 1);
        document.getElementById('nextPageBtn').disabled = (currentPage >= totalPages);

        const tbody = document.getElementById('studentBody');
        if (!records || records.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7">暂无数据</td></tr>';
            updateSelectedCount();
            return;
        }

        let html = '';
        records.forEach(s => {
            const checked = selectedIds.has(s.id) ? 'checked' : '';
            html += `<tr>
            <td class="checkbox-col">
                <input type="checkbox" class="student-checkbox" value="${s.id}" ${checked}
                       onchange="toggleSelection('${s.id}', this.checked)">
            </td>
            <td>${s.id}</td>
            <td>${s.name}</td>
            <td>${s.age}</td>
            <td>${s.age >= 18 ? '是' : '否'}</td>
            <td>${s.gender || ''}</td>
            <td>
                <div class="action-cell">
                    <button class="btn btn-warning btn-sm" onclick="openEdit('${s.id}')">修改</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteStudent('${s.id}')">删除</button>
                </div>
            </td>
        </tr>`;
        });
        tbody.innerHTML = html;
        updateSelectedCount();
        updateSelectAllState();
    }

    // ========== 数据加载 ==========
    function loadPage(params) {
        let url = `${API_BASE}/page?pageNum=${currentPage}&pageSize=5`;
        if (params) url += params;
        fetch(url)
            .then(res => res.json())
            .then(data => renderPage(data))
            .catch(err => alert('请求失败：' + err.message));
    }

    function loadAll() {
        const name = document.getElementById('nameInput').value.trim();
        const minAge = document.getElementById('minAgeInput').value.trim();
        const maxAge = document.getElementById('maxAgeInput').value.trim();
        const gender = document.getElementById('genderFilter').value;

        let params = '';
        if (name) params += `&name=${encodeURIComponent(name)}`;
        if (minAge) params += `&minAge=${minAge}`;
        if (maxAge) params += `&maxAge=${maxAge}`;
        if (gender) params += `&gender=${encodeURIComponent(gender)}`;

        currentPage = 1;
        loadPage(params);
    }

    function goPage(delta) {
        const newPage = currentPage + delta;
        if (newPage < 1 || newPage > totalPages) return;
        currentPage = newPage;

        const name = document.getElementById('nameInput').value.trim();
        const minAge = document.getElementById('minAgeInput').value.trim();
        const maxAge = document.getElementById('maxAgeInput').value.trim();
        const gender = document.getElementById('genderFilter').value;

        let params = '';
        if (name) params += `&name=${encodeURIComponent(name)}`;
        if (minAge) params += `&minAge=${minAge}`;
        if (maxAge) params += `&maxAge=${maxAge}`;
        if (gender) params += `&gender=${encodeURIComponent(gender)}`;

        loadPage(params);
    }

    // ========== 全选 ==========
    document.getElementById('selectAll').addEventListener('change', function() {
        const checkboxes = document.querySelectorAll('.student-checkbox');
        const isChecked = this.checked;
        checkboxes.forEach(cb => {
            cb.checked = isChecked;
            toggleSelection(cb.value, isChecked);
        });
    });

    // ========== 批量删除 ==========
    document.getElementById('batchDeleteBtn').addEventListener('click', function() {
        if (selectedIds.size === 0) {
            alert('请至少选择一个学生');
            return;
        }
        const ids = Array.from(selectedIds);
        if (!confirm(`确定要删除选中的 ${ids.length} 名学生吗？`)) return;

        fetch(API_BASE + '/students/batch', {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(ids)
        })
            .then(res => res.json())
            .then(result => {
                alert(result.message || '操作完成');
                if (result.code === 200) {
                    selectedIds.clear();
                    loadAll();
                    loadGenderStats();
                }
            })
            .catch(err => alert('批量删除失败：' + err.message));
    });

    // ========== 导出 Excel ==========
    document.getElementById('exportBtn').addEventListener('click', function() {
        window.open(API_BASE + '/students/export', '_blank');
    });

    // ========== 导入 Excel ==========
    document.getElementById('importBtn').addEventListener('click', function() {
        document.getElementById('fileInput').click();
    });

    document.getElementById('fileInput').addEventListener('change', function() {
        const file = this.files[0];
        if (!file) return;

        const formData = new FormData();
        formData.append('file', file);

        fetch(API_BASE + '/students/import', {
            method: 'POST',
            body: formData
        })
            .then(res => res.json())
            .then(result => {
                alert(result.message || '导入完成');
                if (result.code === 200) {
                    loadAll();
                    loadGenderStats();
                }
            })
            .catch(err => alert('导入失败：' + err.message));
        this.value = '';
    });

    // ========== 按性别筛选 ==========
    document.getElementById('genderFilter').addEventListener('change', function() {
        currentPage = 1;
        loadAll();
    });

    // ========== 统计面板 ==========
    function loadGenderStats() {
        fetch(API_BASE + '/students/stats/gender')
            .then(res => res.json())
            .then(result => {
                const data = result.data || [];
                let maleCount = 0;
                let femaleCount = 0;
                data.forEach(item => {
                    if (item.gender === '男') maleCount = item.count;
                    if (item.gender === '女') femaleCount = item.count;
                });

                fetch(API_BASE + '/students/stats/avg-age')
                    .then(res => res.json())
                    .then(avgResult => {
                        const avgAge = avgResult.data ? avgResult.data.toFixed(1) : '未知';
                        document.getElementById('statsPanel').innerHTML =
                            `📊 统计信息：总人数 ${maleCount + femaleCount} 人 | 男生 ${maleCount} 人 | 女生 ${femaleCount} 人 | 平均年龄 ${avgAge} 岁`;
                    })
                    .catch(err => console.error('平均年龄请求失败', err));
            })
            .catch(err => console.error('统计失败', err));
    }

    // ========== 其他操作 ==========
    document.getElementById('loadAllBtn').addEventListener('click', loadAll);
    document.getElementById('prevPageBtn').addEventListener('click', () => goPage(-1));
    document.getElementById('nextPageBtn').addEventListener('click', () => goPage(1));

    document.getElementById('searchNameBtn').addEventListener('click', function() {
        const keyword = document.getElementById('nameInput').value.trim();
        if (!keyword) { alert('请输入姓名关键词'); return; }
        currentPage = 1;
        loadPage(`&name=${encodeURIComponent(keyword)}`);
    });

    document.getElementById('searchAgeBtn').addEventListener('click', function() {
        const min = document.getElementById('minAgeInput').value.trim();
        const max = document.getElementById('maxAgeInput').value.trim();
        if (!min || !max) { alert('请填写最小年龄和最大年龄'); return; }
        currentPage = 1;
        loadPage(`&minAge=${min}&maxAge=${max}`);
    });

    document.getElementById('addBtn').addEventListener('click', function() {
        const id = document.getElementById('newId').value.trim();
        const name = document.getElementById('newName').value.trim();
        const age = document.getElementById('newAge').value.trim();
        const gender = document.getElementById('newGender').value.trim();
        if (!id || !name || !age || !gender) { alert('请完整填写所有字段'); return; }
        const student = { id, name, age: parseInt(age), gender };
        fetch(API_BASE + '/students', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(student)
        })
            .then(res => res.json())
            .then(result => {
                alert(result.message || '操作完成');
                loadAll();
                loadGenderStats();
                document.getElementById('newId').value = '';
                document.getElementById('newName').value = '';
                document.getElementById('newAge').value = '';
                document.getElementById('newGender').value = '';
            })
            .catch(err => alert('添加失败：' + err.message));
    });

    function openEdit(id) {
        fetch(API_BASE + '/students/' + id)
            .then(res => res.json())
            .then(result => {
                const s = result.data || result;
                editingId = id;
                document.getElementById('editId').value = s.id;
                document.getElementById('editName').value = s.name;
                document.getElementById('editAge').value = s.age;
                document.getElementById('editGender').value = s.gender || '';
                document.getElementById('editModal').classList.add('active');
            })
            .catch(err => alert('获取学生信息失败：' + err.message));
    }

    document.getElementById('editCancelBtn').addEventListener('click', function() {
        document.getElementById('editModal').classList.remove('active');
    });

    document.getElementById('editConfirmBtn').addEventListener('click', function() {
        const name = document.getElementById('editName').value.trim();
        const age = document.getElementById('editAge').value.trim();
        const gender = document.getElementById('editGender').value.trim();
        if (!name || !age || !gender) { alert('请完整填写所有字段'); return; }
        const student = { id: editingId, name, age: parseInt(age), gender };
        fetch(API_BASE + '/students', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(student)
        })
            .then(res => res.json())
            .then(result => {
                alert(result.message || '操作完成');
                document.getElementById('editModal').classList.remove('active');
                loadAll();
                loadGenderStats();
            })
            .catch(err => alert('修改失败：' + err.message));
    });

    function deleteStudent(id) {
        if (!confirm('确定要删除学号为 ' + id + ' 的学生吗？')) return;
        fetch(API_BASE + '/students/' + id, { method: 'DELETE' })
            .then(res => res.json())
            .then(result => {
                alert(result.message || '操作完成');
                loadAll();
                loadGenderStats();
            })
            .catch(err => alert('删除失败：' + err.message));
    }

    document.getElementById('editModal').addEventListener('click', function(e) {
        if (e.target === this) this.classList.remove('active');
    });

    // 页面加载完成后自动加载
    window.onload = function() {
        loadAll();
        loadGenderStats();
    };
    // ========== 生成测试数据 ==========
    document.getElementById('generateBtn').addEventListener('click', function() {
        const count = document.getElementById('generateCount').value.trim();
        if (!count || count <= 0) {
            alert('请输入要生成的数量');
            return;
        }

        fetch(API_BASE + '/students/generate?count=' + count, {
            method: 'POST'
        })
            .then(res => res.json())
            .then(result => {
                alert(result.message || '生成完成');
                if (result.code === 200) {
                    loadAll();
                    loadGenderStats();
                }
            })
            .catch(err => alert('生成失败：' + err.message));
    });
</script>
</body>
</html>
